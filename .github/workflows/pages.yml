name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # every Monday: refresh the map data from OpenStreetMap
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pre-builds petrol, food, traffic-light, camera and toll-plaza data from OpenStreetMap so the
      # phone loads it instantly. If this step fails the app still works, but falls back to a slow
      # public server (see docs/DEPLOYMENT.md).
      # Keep the last good copy of the data. If the OpenStreetMap download is down on deploy day,
      # the site ships with that copy instead of silently losing traffic lights and cameras.
      - name: Restore last good map data
        uses: actions/cache/restore@v4
        with:
          path: apps/web/public/data/osm
          key: osm-data-none
          restore-keys: osm-data-
      - name: Build map data
        id: osmdata
        continue-on-error: true
        run: |
          pip install osmium
          bash scripts/build-osm-data.sh
      - name: Save map data as the last good copy
        if: steps.osmdata.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: apps/web/public/data/osm
          key: osm-data-${{ github.run_id }}
      # Never ship a build with no map data at all: the app would show no lights or cameras.
      - name: Check map data is present
        run: |
          test -s apps/web/public/data/osm/manifest.json || { echo "::error::No map data: the OpenStreetMap download failed and there is no earlier copy. Re-run this workflow."; exit 1; }
          echo "Map data from: ${{ steps.osmdata.outcome == 'success' && 'a fresh download' || 'the last good copy' }}"
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
