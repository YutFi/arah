name: Diagnostic - OSM AwAS data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - run: curl -fL --retry 3 -o /tmp/my.osm.pbf https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
      - run: python3 scripts/diag-osm-awas.py /tmp/my.osm.pbf | tee /tmp/diag.txt
      - name: Publish output to a branch
        run: |
          git config user.name "diag"
          git config user.email "diag@example.invalid"
          git checkout --orphan diag-output
          git rm -rf . >/dev/null
          cp /tmp/diag.txt diag.txt
          git add diag.txt
          git commit -m "diag output"
          git push -f origin diag-output
